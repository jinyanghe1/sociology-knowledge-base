# pytest 配置文件
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出格式
addopts = -v --tb=short --strict-markers

# 标记定义
markers =
    security: 安全相关测试
    concurrency: 并发相关测试
    parser: 解析器相关测试
    mcp: MCP 服务器相关测试
    slow: 慢速测试
    requires_chromadb: 需要 ChromaDB 的测试
    requires_ollama: 需要 Ollama 的测试

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
